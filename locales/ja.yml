forget:
  needs_yes: "codex-notifier forget には確認が必要です。ターミナルで実行するか、--yes を付けてください"
  warning: "この操作は、このコンピュータとそのペアリングを Notifier for Codex のサーバーから消去し、\n`codex-notifier uninstall` と同じように Codex から codex-notifier を取り除き、ここにある認証情報とファイルを削除します。\nこのコンピュータとペアリングしていたスマートフォンからは、このコンピュータが消えます。\nウェブサイトで購入したライセンスは解約されません。notifierforcodex.com/licence の\n「Erase my licence」から行ってください。"
  # ユーザーが入力する確認の言葉。`yes` も常に受け付けられる
  yes_word: "はい"
  prompt: "\n続けるには %{yes} と入力してください: "
  nothing_erased: "何も消去されませんでした。"
  erased: "このコンピュータとそのペアリングをサーバーから消去しました。"
  already_forgotten: "サーバーはすでにこのコンピュータを忘れていました。"
  nothing_removed: "%{error}。このコンピュータからは何も削除されていないので、`codex-notifier forget` をもう一度実行できます"
  not_registered: "このコンピュータはサーバーに登録されていないため、サーバー側で消去するものはありません。"

