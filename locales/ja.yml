  code_lasts: "  ペアリングはいつでも構いません。このコードは %{duration} 有効です。"
  completes_on_its_own: "  スマートフォンが接続すると、ペアリングは自動で完了します。"
  waiting: "  スマートフォンを待っています...（Ctrl+C を押しても大丈夫です。スマートフォンが接続すればペアリングは自動で完了します）"
  code_expired: "スマートフォンが使う前にコードの期限が切れました。`codex-notifier pair` をもう一度実行してください。"
  code_is_six_digits: "コードは Notifier for Codex アプリに表示される6桁の数字です"
  credentials_stored: "認証情報を%{store}に保存しました（%{path}）。"
  test_sent: "スマートフォンにテスト通知を送りました。"
  test_failed: "テスト通知をまだ送れません: %{error}"
  done: "完了です。いつも通り `codex` を起動してください。Codex が終了したり、あなたを必要としたときに\nプッシュ通知が届き、スマートフォンから承認・拒否・返答ができます。`codex-notifier doctor` で全体を確認できます。"
  paired_with: "%{name}（%{platform}）とペアリングしました。"
  hours_one: "1時間"
  hours_other: "%{count}時間"
  minutes_one: "1分"
  minutes_other: "%{count}分"
  pitch: "スマートフォンのアプリにサブスクリプションの案内が表示されます。アプリストアを通さず、ここからすべてをロック解除することもできます:"
  pitch_annual: "  codex-notifier unlock             年額 %{price}"
  pitch_lifetime: "  codex-notifier unlock --lifetime  %{price} の一回払い"
  pitch_covers: "コンピュータ %{computers} 台と、それらにペアリングしたすべてのスマートフォンが対象です。%{days} 日間の返金保証。"
  welcome_no_terminal: "テスト通知をスマートフォンに送りました。そこから返答してみてください。"
  welcome: "テスト通知をスマートフォンに送りました。そこから返答してみてください..."
  welcome_skip: "（Enter でスキップ）"
  welcome_answered: "✓ スマートフォンから「%{answer}」と返答がありました。Codex にもこのように返答します。"
  welcome_no_answer: "まだ返答がありません。通知はスマートフォンに1時間残ります。"

