cross_promo:
  line: "Claude Code を検出しました。Claude Code Notifier アプリ（iPhone・Android）で、Claude Code の承認や質問もスマートフォンに届きます。このコンピュータはコマンド 1 つで設定できます: %{command}  ·  %{url}"
