  # After `codex-notifier pair`, above a QR code (pair_scan) or without one (pair_steps), the app's link and the command
  pair_title: "Claude Code を検出しました。Claude Code Notifier アプリ（iPhone・Android）で、Claude Code の承認や質問もスマートフォンに届きます。"
  pair_scan: "スキャンしてアプリを入手し、このコンピュータをコマンド 1 つで設定してください:"
  pair_steps: "アプリを入手し、このコンピュータをコマンド 1 つで設定してください:"

