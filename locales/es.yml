  line: "Antigravity detectado: recibe también en el teléfono las aprobaciones y preguntas de Antigravity, con la app Antigravity Notifier (iPhone y Android). Prepara este ordenador con un solo comando: %{command}  ·  %{url}"
  notification: "Antigravity detectado: recibe también en el teléfono las aprobaciones de Antigravity, con la app Antigravity Notifier."
  pair_title: "Antigravity detectado: recibe también en el teléfono las aprobaciones y preguntas de Antigravity, con la app Antigravity Notifier (iPhone y Android)."
