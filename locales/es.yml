# Suggests the Claude Code Notifier app (and its ccn CLI) to someone who also uses Claude Code (crosspromo.rs).
# "Claude Code Notifier", command and url are not translated; never name one computer platform.
cross_promo:
  line: "Claude Code detectado: recibe también en el teléfono las aprobaciones y preguntas de Claude Code, con la app Claude Code Notifier (iPhone y Android). Prepara este ordenador con un solo comando: %{command}  ·  %{url}"
