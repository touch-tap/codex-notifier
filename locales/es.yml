  # After `codex-notifier pair`, above a QR code (pair_scan) or without one (pair_steps), the app's link and the command
  pair_title: "Claude Code detectado: recibe también en el teléfono las aprobaciones y preguntas de Claude Code, con la app Claude Code Notifier (iPhone y Android)."
  pair_scan: "Escanea para obtener la app y prepara este ordenador con un solo comando:"
  pair_steps: "Descarga la app y prepara este ordenador con un solo comando:"

# The same for Antigravity Notifier, to someone with Google Antigravity (`agy`) and not antigravity-notifier.
