# Español. Traduce locales/en.yml; ver locales/README.md. Registro: tú, sin vosotros. Vocabulario de
# la app Notifier for Codex: vincular (pair), conectar (connect), licencia, desbloquear, teléfono, ordenador
# (como en la app: Ordenadores > Añadir ordenador). Neutro para España y Latinoamérica: teléfono, no móvil.
_version: 1

cli:
  about: "Notifier for Codex: recibe un aviso en el teléfono cuando Codex te necesite y responde desde ahí"
  pair:
    about: "Vincular este ordenador con tu teléfono. Pasa el código que muestra la app; sin código, te lo pide, y si pulsas Enter sin escribirlo muestra un código QR para escanear"
    code: "El código de 6 dígitos que muestra la app Notifier for Codex"
    name: "Cómo se llama este ordenador en tu teléfono (por defecto: el nombre de host)"
    no_wait: "Mostrar el código QR y volver de inmediato: la vinculación se completa sola cuando el teléfono se conecta"
  setup:
    about: "Instalar los hooks de Codex y las notificaciones de escritorio (pair y codex-notifier sin argumentos lo hacen primero)"
  doctor:
    about: "Comprobar los hooks, las credenciales, el servidor y lo que admite esta terminal"
  test:
    about: "Enviar una notificación de prueba a cada teléfono vinculado"
  devices:
    about: "Listar los teléfonos vinculados, o revocar uno"
    revoke: "Revocar un teléfono vinculado por su nombre o id"
  config:
    about: "Ver o cambiar los ajustes de este ordenador (también editables desde el teléfono)"
    show: "Mostrar los ajustes en vigor"
    set: "Cambiar un ajuste, p. ej. `codex-notifier config set hold_ceiling_seconds 300` o `codex-notifier config set quiet_hours 22:00-08:00`"
  sync:
    about: "Traer ahora los últimos ajustes del servidor"
  unlock:
    about: "Comprar una licencia para este ordenador en el navegador: desbloquea todos los teléfonos vinculados con él"
    lifetime: "Pagar una sola vez en lugar de cada año (o pasar una licencia anual a permanente, conservando la clave)"
  upgrade:
    about: "Actualizar codex-notifier a la última versión (también se comprueba una vez al día en segundo plano)"
    check: "Solo decir si existe una versión más reciente: código 0 si está al día, 10 si hay una disponible"
    quiet: "No mostrar nada salvo que algo haya fallado"
  activate:
    about: "Usar una clave de licencia en este ordenador (hasta 3 ordenadores por licencia)"
    key: "La clave de tu correo, CCN-XXXX-XXXX-XXXX-XXXX"
    replace: "Liberar el lugar de otro ordenador en la licencia, por su nombre, para hacer sitio a este"
  deactivate:
    about: "Liberar el lugar de este ordenador en la licencia para usar la clave en otro sitio"
  licence:
    about: "Mostrar la licencia de este ordenador y los ordenadores que la usan"
  uninstall:
    about: "Quitar los hooks, las credenciales, las vinculaciones y el estado local"
  forget:
    about: "Borrar este ordenador y sus vinculaciones del servidor, y luego desinstalar"
    yes: "No pedir confirmación"

