# Polski. Tłumaczenie locales/en.yml; zob. locales/README.md. Rejestr: nieformalne "ty" (Cię, Twój wielką literą), jak w aplikacji i powiadomieniach push.
_version: 1

cli:
  about: "Notifier for Codex: dostawaj push na telefon, gdy Codex Cię potrzebuje, i odpowiadaj stamtąd"
  pair:
    about: "Sparuj ten komputer z telefonem. Podaj kod z aplikacji; bez kodu polecenie o niego zapyta, a naciśnięcie Enter bez wpisywania pokaże kod QR do zeskanowania"
    code: "6-cyfrowy kod pokazany w aplikacji Notifier for Codex"
    name: "Nazwa tego komputera na telefonie (domyślnie: nazwa hosta)"
    no_wait: "Pokaż kod QR i od razu zakończ: parowanie dokończy się samo, gdy telefon się połączy"
  setup:
    about: "Zainstaluj hooki Codex i powiadomienia na pulpicie (pair i samo codex-notifier robią to najpierw)"
  doctor:
    about: "Sprawdź hooki, dane logowania, serwer i możliwości tego terminala"
  test:
    about: "Wyślij testowe powiadomienie na każdy sparowany telefon"
  devices:
    about: "Wyświetl sparowane telefony albo odłącz jeden"
    revoke: "Odłącz sparowany telefon po nazwie lub id"
  config:
    about: "Pokaż lub zmień ustawienia tego komputera (można je też zmieniać z telefonu)"
    show: "Wypisz obowiązujące ustawienia"
    set: "Ustaw jedno ustawienie, np. `codex-notifier config set hold_ceiling_seconds 300` lub `codex-notifier config set quiet_hours 22:00-08:00`"
  sync:
    about: "Pobierz teraz najnowsze ustawienia z serwera"
  unlock:
    about: "Kup w przeglądarce licencję na ten komputer: odblokowuje każdy sparowany z nim telefon"
    lifetime: "Zapłać raz zamiast co roku (lub zamień licencję roczną na dożywotnią, zachowując klucz)"
  upgrade:
    about: "Zaktualizuj codex-notifier do najnowszego wydania (sprawdzane też raz dziennie w tle)"
    check: "Tylko powiedz, czy jest nowsze wydanie: kod wyjścia 0, gdy aktualne, 10, gdy jest dostępne"
    quiet: "Nic nie wypisuj, chyba że coś pójdzie nie tak"
  activate:
    about: "Użyj klucza licencyjnego na tym komputerze (do 3 komputerów na licencję)"
    key: "Klucz z Twojego e-maila, CCN-XXXX-XXXX-XXXX-XXXX"
    replace: "Zwolnij miejsce innego komputera na licencji, po jego nazwie, aby zrobić miejsce dla tego"
  deactivate:
    about: "Zwolnij miejsce tego komputera na licencji, aby użyć klucza gdzie indziej"
  licence:
    about: "Pokaż licencję tego komputera i komputery, które z niej korzystają"
  uninstall:
    about: "Usuń hooki, dane logowania, parowania i lokalny stan"
  forget:
    about: "Usuń ten komputer i jego parowania z serwera, potem odinstaluj"
    yes: "Nie pytaj o potwierdzenie"

