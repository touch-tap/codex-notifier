# "Claude Code Notifier", command and url are not translated; never name one computer platform.
cross_promo:
  line: "Wykryto Claude Code — odbieraj na telefonie także zatwierdzenia i pytania z Claude Code, z aplikacją Claude Code Notifier (iPhone i Android). Ten komputer skonfigurujesz jednym poleceniem: %{command}  ·  %{url}"
  notification: "Wykryto Claude Code — odbieraj na telefonie także zatwierdzenia z Claude Code, z aplikacją Claude Code Notifier."
  # After `codex-notifier pair`, above a QR code (pair_scan) or without one (pair_steps), the app's link and the command
  pair_title: "Wykryto Claude Code — odbieraj na telefonie także zatwierdzenia i pytania z Claude Code, z aplikacją Claude Code Notifier (iPhone i Android)."
  pair_scan: "Zeskanuj, aby pobrać aplikację, a potem skonfiguruj ten komputer jednym poleceniem:"
  pair_steps: "Pobierz aplikację, a potem skonfiguruj ten komputer jednym poleceniem:"

