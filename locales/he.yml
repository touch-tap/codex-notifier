  line: "זוהה Antigravity — קבלו גם את האישורים והשאלות של Antigravity בטלפון, עם האפליקציה Antigravity Notifier (iPhone ו-Android). הגדירו את המחשב הזה בפקודה אחת: %{command}  ·  %{url}"
  notification: "זוהה Antigravity — קבלו גם את האישורים של Antigravity בטלפון, עם האפליקציה Antigravity Notifier."
  pair_title: "זוהה Antigravity — קבלו גם את האישורים והשאלות של Antigravity בטלפון, עם האפליקציה Antigravity Notifier (iPhone ו-Android)."
  pair_scan: "סרקו כדי להוריד את האפליקציה, ואז הגדירו את המחשב הזה בפקודה אחת:"
  pair_steps: "הורידו את האפליקציה, ואז הגדירו את המחשב הזה בפקודה אחת:"

