rate:
  notification: "נהנים מ-Notifier for Codex? דירוג קצר עוזר למפתחים אחרים למצוא אותו."
  message: "נהנים מ-Notifier for Codex? דירוג קצר עוזר למפתחים אחרים למצוא אותו: %{url}"

