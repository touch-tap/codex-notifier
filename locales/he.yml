# Suggests the Claude Code Notifier app (and its ccn CLI) to someone who also uses Claude Code (crosspromo.rs).
# "Claude Code Notifier", command and url are not translated; never name one computer platform.
cross_promo:
  line: "זוהה Claude Code — קבלו גם את האישורים והשאלות של Claude Code בטלפון, עם האפליקציה Claude Code Notifier (iPhone ו-Android). הגדירו את המחשב הזה בפקודה אחת: %{command}  ·  %{url}"
  notification: "זוהה Claude Code — קבלו גם את האישורים של Claude Code בטלפון, עם האפליקציה Claude Code Notifier."
  # After `codex-notifier pair`, above a QR code (pair_scan) or without one (pair_steps), the app's link and the command
  pair_title: "זוהה Claude Code — קבלו גם את האישורים והשאלות של Claude Code בטלפון, עם האפליקציה Claude Code Notifier (iPhone ו-Android)."
  pair_scan: "סרקו כדי להוריד את האפליקציה, ואז הגדירו את המחשב הזה בפקודה אחת:"
  pair_steps: "הורידו את האפליקציה, ואז הגדירו את המחשב הזה בפקודה אחת:"

# The same for Antigravity Notifier, to someone with Google Antigravity (`agy`) and not antigravity-notifier.
# Its phone apps may not be in the stores yet: the QR code and links open antigravitynotifier.com, never a store.
