  line: "Đã phát hiện Antigravity — nhận cả yêu cầu phê duyệt và câu hỏi của Antigravity trên điện thoại, với ứng dụng Antigravity Notifier (iPhone và Android). Thiết lập máy tính này bằng một lệnh: %{command}  ·  %{url}"
  notification: "Đã phát hiện Antigravity — nhận cả yêu cầu phê duyệt của Antigravity trên điện thoại, với ứng dụng Antigravity Notifier."
  pair_title: "Đã phát hiện Antigravity — nhận cả yêu cầu phê duyệt và câu hỏi của Antigravity trên điện thoại, với ứng dụng Antigravity Notifier (iPhone và Android)."
  pair_scan: "Quét để tải ứng dụng, rồi thiết lập máy tính này bằng một lệnh:"
  pair_steps: "Tải ứng dụng, rồi thiết lập máy tính này bằng một lệnh:"

# Asks once, after 20 answers from the phone, for an app-store rating (rate.rs). url is not translated.
rate:
  notification: "Bạn thích Notifier for Codex? Một đánh giá nhanh giúp các nhà phát triển khác tìm thấy ứng dụng."
  message: "Bạn thích Notifier for Codex? Một đánh giá nhanh giúp các nhà phát triển khác tìm thấy ứng dụng: %{url}"

hooks:
  doctor_presence_none: "hiện diện: không phát hiện được ở đây, nên không có gì chờ điện thoại: điện thoại nhận một thông báo và bạn trả lời trong terminal (`codex-notifier config set hold_without_presence on` để vẫn chờ)"
